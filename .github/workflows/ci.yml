name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and schema migration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest
      - name: Verify fresh schema migration
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/callradar-ci.db
        run: alembic -c alembic.ini upgrade head

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  compose-smoke:
    name: Docker Compose build and health smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the deployment stack
        run: docker compose --env-file .env.example config --quiet
      - name: Build production images
        run: docker compose --env-file .env.example build
      - name: Start API, database, and dashboard
        run: docker compose --env-file .env.example up -d --wait --wait-timeout 150 db api web
      - name: Verify live service endpoints
        run: |
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/health
          curl --fail --retry 5 --retry-connrefused http://localhost:8000/api/v1/processing/progress
          curl --fail --retry 5 --retry-connrefused http://localhost:3000/
      - name: Print service logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.example down -v --remove-orphans
